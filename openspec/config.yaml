schema: spec-driven

context: |
  This is a RimWorld 1.6 mod monorepo. Every change and capability has exactly one owner: either one mod or one repository-tooling component. Repository-owned mods do not depend on one another.
  External runtime dependencies must be classified as required or optional according to actual playability. Product specs and task state must distinguish behavior delivered by the change from future scope.

rules:
  proposal:
    - State one owner. For a mod, give its display name, package ID, and repository-relative path; for tooling, give the component name and repository-relative path. Keep affected components and external dependencies separate from ownership.
    - Classify each external runtime dependency as required or optional according to actual runtime semantics. If any `XmlExtensions.*` operation is used, declare XML Extensions (`imranfish.xmlextensions`, Workshop `2574315206`) as a required dependency.
    - State whether gameplay behavior is delivered by the change or only specified for later work.
  design:
    - Prefer Defs and XML patch operations for declarative Def changes; use C# or Harmony only when the behavior cannot be expressed safely in XML. Prefer the most specific suitable XML Extensions operation when vanilla patch operations are insufficient.
    - Detect optional C# integrations by canonical package ID and validate every consumed type/member/Def shape. For optional XML integrations, use `XmlExtensions.FindMod` with `packageId=true`. On shape drift, fail the adapter closed with one bounded diagnostic instead of partially patching.
    - Do not use file hashes, exact mod versions, or full-text comparisons as the sole runtime compatibility probe. Hashes remain valid and required for artifact identity, concurrency, evidence, and recovery contracts.
  specs:
    - Give every behavioural requirement at least one observable WHEN/THEN scenario.
    - Specify player-visible, balance-significant, and compatibility-significant values; leave incidental implementation constants to the design.
    - Automation that mutates user state must specify backup, atomicity, failure restoration, and verified postconditions.
  tasks:
    - Avoid tests that merely repeat literals, but retain tests for derived behavior, schemas, package/dependency validity, and risky value boundaries in the honest test tier.
    - Include a final task governed by the root `AGENTS.md` acceptance gate whenever runtime behavior changes.
